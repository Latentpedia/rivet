name: Rust CI
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
defaults:
  run:
    # Enable fail-fast behavior
    shell: bash -e {0}
env:
  RUSTFLAGS: "--cfg tokio_unstable"
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # clippy:
  #   name: Clippy
  #   runs-on: depot-ubuntu-24.04-8
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: actions-rust-lang/setup-rust-toolchain@v1
  #       with:
  #         toolchain: stable
  #         components: clippy
  #
  #     - uses: Swatinem/rust-cache@v2
  #       with:
  #         shared-key: "rust-ci"
  #         cache-on-failure: true
  #
  #     - name: Run clippy
  #       run: cargo clippy --all-targets --all-features -- -W warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-shared-key: rust-ci
          cache-on-failure: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Caches the C++ compilation (rocksdb, the `lbug` C++ shim): the `cc`-crate
      # and cmake builds shell out to the system compiler, which this action wraps
      # via symlinks. Sized for rocksdb's object files; falls back to the main-branch
      # cache on PRs.
      - name: Setup ccache (Linux)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: rust-check-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.ref }}
          max-size: 2G
          create-symlink: true
          restore-keys: |
            rust-check-ccache-${{ runner.os }}-${{ runner.arch }}-refs/heads/main
            rust-check-ccache-${{ runner.os }}-${{ runner.arch }}-

      # The `lbug` prebuilt archive must postdate LadybugDB/ladybug#1005 (partition
      # routing hooks in the shipped headers). The latest crates.io release may be
      # older, so resolve the newest successful main build-and-deploy run, mirroring
      # LadybugDB/ladybug-rust's CI. The `lbug` build script downloads that run's
      # archive when `LBUG_PRECOMPILED_RUN_ID` is set.
      - name: Resolve ladybug prebuilt run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          API_URL="https://api.github.com/repos/LadybugDB/ladybug/actions/workflows/build-and-deploy.yml/runs"
          AUTH_HEADER="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT_HEADER="Accept: application/vnd.github+json"
          VERSION_HEADER="X-GitHub-Api-Version: 2022-11-28"
          RUN_ID="$(curl -fsSL -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$VERSION_HEADER" \
            "$API_URL?branch=main&status=success&per_page=1" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); runs=data.get("workflow_runs") or []; print(runs[0]["id"] if runs else "")')"
          if [ -z "$RUN_ID" ]; then
            echo "Could not find a successful LadybugDB/ladybug build-and-deploy run." >&2
            exit 1
          fi
          echo "Using Ladybug build-and-deploy RUN_ID=$RUN_ID"
          echo "LBUG_PRECOMPILED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Set up repository-specific Rust dependencies
        if: ${{ hashFiles('scripts/ci/pre-rust-check.sh') != '' }}
        run: scripts/ci/pre-rust-check.sh

      - name: Check event-driven drain invariants
        run: rivetkit-rust/packages/rivetkit-core/scripts/check-event-driven-drains.sh

      - name: Check
        run: cargo check --workspace --exclude rivetkit-wasm
        env:
          # Deny warnings
          RUSTFLAGS: --cfg tokio_unstable -D warnings -A unsafe-op-in-unsafe-fn

      - name: Check Rust publish surface
        run: |
          cargo check -p rivetkit --no-default-features --features rivetkit-core/sqlite-remote
          if cargo tree -e normal -p rivetkit --no-default-features --features rivetkit-core/sqlite-remote | grep -i 'git+'; then
            echo "published rivetkit feature set must not contain git dependencies" >&2
            exit 1
          fi
          cargo publish -p rivet-error-macros --dry-run

  # test:
  #   name: Test
  #   runs-on: depot-ubuntu-24.04-8
