[package]
name = "example-ladybug-graph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "A platform for running distributed message-passing graph algorithms (k-core, WCC) on Rivet, persisting typed application data into the LadybugDB graph store over the ADBC (Arrow) interface."

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
lbug = { workspace = true }
adbc_core = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-ipc.workspace = true
axum = { workspace = true, features = [ "json" ] }
reqwest = { workspace = true, features = [ "blocking" ] }
rivetkit = { path = "../../rivetkit-rust/packages/rivetkit" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
