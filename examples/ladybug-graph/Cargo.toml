[package]
name = "example-ladybug-graph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "A platform for running distributed message-passing graph algorithms (k-core, WCC) on Rivet, persisting typed application data into the LadybugDB graph store over the ADBC (Arrow) interface."

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
# Tracks ladybug-rust main past the routing-hooks bindings (LadybugDB/ladybug-rust#40,
# merged as e77dabd). No published `lbug` crate carries `RoutingGuard` yet; flip back to
# `lbug.workspace = true` once a release containing them is cut.
lbug = { git = "https://github.com/LadybugDB/ladybug-rust", rev = "e77dabd205cc284ee73a580b6f7557db09354a29", default-features = false }
adbc_core = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-ipc.workspace = true
axum = { workspace = true, features = [ "json" ] }
reqwest = { workspace = true, features = [ "blocking" ] }
rivetkit = { path = "../../rivetkit-rust/packages/rivetkit" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
